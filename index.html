<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Viral Script Generator</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0f0f0f,#1c1c1c);
  color:white;
}

.container{
  max-width:500px;
  margin:40px auto;
  padding:20px;
}

h2{
  font-size:22px;
}

textarea{
  width:100%;
  height:120px;
  border-radius:12px;
  border:none;
  padding:15px;
  font-size:14px;
  margin-top:15px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:12px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.generate{
  background:#ff2d2d;
  color:white;
}

.voice{
  background:#333;
  color:white;
}

#output{
  margin-top:20px;
  background:#111;
  padding:15px;
  border-radius:12px;
  white-space:pre-line;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🔥 AI Viral Script Generator</h2>

  <textarea id="input" placeholder="Masukkan deskripsi produk..."></textarea>

  <button class="generate" onclick="generate()">Generate Script</button>
  <button class="voice" onclick="speak()">Play Voice</button>

  <div id="output"></div>
</div>

<script>
function generate() {
  const text = document.getElementById("input").value;

  if (!text) {
    alert("Masukkan deskripsi dulu!");
    return;
  }

  const result = `
🔥 HOOK:
Kamu gak akan nyangka ini!

😱 MASALAH:
${text} sering bikin orang salah pilih...

💡 SOLUSI:
Ini solusi terbaik yang bisa kamu pakai sekarang juga!

🚀 CTA:
Klik sekarang sebelum kehabisan!
`;

  document.getElementById("output").innerText = result;
}

function speak() {
  const text = document.getElementById("output").innerText;

  if (!text) {
    alert("Generate script dulu!");
    return;
  }

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "id-ID";
  speech.rate = 1;
  speech.pitch = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}
</script>

</body>
</html>
