<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Script Generator</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#111,#1f1f1f);
  color:white;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:500px;
  padding:20px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

textarea{
  width:100%;
  height:120px;
  border-radius:12px;
  border:none;
  padding:12px;
  font-size:14px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}

.generate{
  background:#ff3c3c;
  color:white;
}

.voice{
  background:#333;
  color:white;
}

#output{
  margin-top:20px;
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">
<h2>🔥 AI Viral Script Generator</h2>

<textarea id="input" placeholder="Masukkan deskripsi produk..."></textarea>

<button class="generate" onclick="generate()">Generate Script</button>
<button class="voice" onclick="speak()">Play Voice</button>

<div id="output"></div>
</div>

<script>

function generate() {
  const text = document.getElementById("input").value;

  document.getElementById("output").innerText = `
🔥 HOOK:
Kamu gak akan nyangka ini!

😱 MASALAH:
${text} sering bikin orang salah pilih...

💡 SOLUSI:
Ini solusi terbaik yang bisa kamu pakai sekarang juga!

🚀 CTA:
Klik sekarang sebelum kehabisan!
`;
}
