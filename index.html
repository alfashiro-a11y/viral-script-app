<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Viral Script Generator</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

.container{
  max-width:500px;
  margin:40px auto;
  padding:20px;
}

textarea{
  width:100%;
  height:100px;
  border-radius:12px;
  padding:10px;
  border:none;
  margin-top:10px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

.generate{ background:#ff2d2d; color:white; }
.voice{ background:#333; color:white; }

#output{
  margin-top:20px;
  background:#111;
  padding:15px;
  border-radius:12px;
  white-space:pre-line;
}

.loader{
  margin-top:10px;
  font-size:13px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="container">
<h2>🔥 AI Viral Script Generator</h2>

<input type="file" id="imageInput" accept="image/*">
<div class="loader" id="loading"></div>

<textarea id="input" placeholder="Atau ketik manual di sini..."></textarea>

<button class="generate" onclick="generate()">Generate Script</button>
<button class="voice" onclick="speak()">Play Voice</button>

<div id="output"></div>
</div>

<script>
const imageInput = document.getElementById("imageInput");
const loading = document.getElementById("loading");

imageInput.addEventListener("change", function(){
  const file = imageInput.files[0];
  if(!file) return;

  loading.innerText = "Membaca gambar... tunggu sebentar ⏳";

  Tesseract.recognize(
    file,
    'ind',
    { logger: m => console.log(m) }
  ).then(({ data: { text } }) => {
      document.getElementById("input").value = text;
      loading.innerText = "Teks berhasil diambil ✅";
  }).catch(()=>{
      loading.innerText = "Gagal membaca gambar ❌";
  });
});

function generate(){
  const text = document.getElementById("input").value;

  if(!text){
    alert("Masukkan deskripsi dulu!");
    return;
  }

  const result = `
🔥 HOOK:
Stop scroll! Ini penting banget!

😱 MASALAH:
${text} sering bikin orang ragu sebelum beli...

💡 SOLUSI:
Sekarang ada solusi yang lebih praktis dan menguntungkan!

🚀 CTA:
Buruan klik sebelum promo habis!
`;

  document.getElementById("output").innerText = result;
}

function speak(){
  const text = document.getElementById("output").innerText;

  if(!text){
    alert("Generate script dulu!");
    return;
  }

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "id-ID";
  speech.rate = 1;
  speech.pitch = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}
</script>

</body>
</html>
