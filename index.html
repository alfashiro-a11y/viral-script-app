<!DOCTYPE html>
<html>
<head>
  <title>Viral Script App</title>
</head>
<body>
  <h1>Web Pertama Jalan 🔥</h1>
  <textarea id="input" placeholder="Masukkan teks..." rows="5" cols="30"></textarea>
  <br><br>
  <button onclick="generate()">Generate</button>
  <p id="output"></p>

  <script>
    function generate() {
      const text = document.getElementById("input").value;
      document.getElementById("output").innerText =
        "HOOK 🔥 " + text + " wajib kamu tahu!";
    }
  </script>
</body>
</html>
